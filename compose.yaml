services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning_gap_dev}
      POSTGRES_USER: ${POSTGRES_USER:-learning_gap_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learning_gap_dev} -d ${POSTGRES_DB:-learning_gap_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
